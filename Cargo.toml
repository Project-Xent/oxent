[workspace]
resolver = "3"
members = ["oxent-sys", "oxent-macros", "oxent"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.92"
license = "0BSD"
repository = "https://github.com/Project-Xent/oxent"
keywords = ["gui", "ui", "windows", "winui", "fluent"]
categories = ["gui", "os::windows-apis"]

[profile.release]
strip = true
panic = "abort"
codegen-units = 1
lto = true

[profile.hot]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
panic = "unwind"
strip = false
