[package]
name = "oxent"
description = "Declarative Rust bindings for the Xent native UI toolkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
include = ["src/**", "examples/**", "LICENSE"]

[dependencies]
oxent-sys = { path = "../oxent-sys", version = "=0.4.0" }

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-gnullvm"
targets = ["x86_64-pc-windows-gnullvm", "aarch64-pc-windows-gnullvm"]
